<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">Persistent shadow routing through the existing checked queue</title>
<desc id="desc">Architecture illustration. An independent baseline review gates a durable allocation. The allocation is bound into a signed check and the existing job queue. A final route, task and review fence precedes dispatch. Candidate execution is blocked. Uncertain effects keep their original identity and reservation.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#6c8eaa"/></marker></defs>
<rect width="1120" height="560" fill="#101b2c"/>
<g fill="#eef5ff" font-family="sans-serif"><text x="40" y="48" font-size="26" font-weight="bold">One decision. One checked execution.</text><text x="40" y="80" font-size="16" fill="#b6c9dd">R7.4-C architecture illustration · shadow only · candidate invocation blocked</text></g>
<g fill="#1b334d" stroke="#5a829f" stroke-width="2"><rect x="40" y="130" width="280" height="95" rx="12"/><rect x="40" y="270" width="280" height="95" rx="12"/><rect x="410" y="200" width="280" height="115" rx="12"/><rect x="780" y="200" width="300" height="115" rx="12"/></g>
<g fill="#eef5ff" font-family="sans-serif" font-size="18"><text x="60" y="166">Designated reviewer</text><text x="60" y="195" font-size="15">Current baseline acceptance</text><text x="60" y="306">Immutable route manifest</text><text x="60" y="335" font-size="15">Declared executor identities</text><text x="430" y="236">Durable allocation</text><text x="430" y="265" font-size="15">Exact request + task + epoch</text><text x="430" y="290" font-size="15">Decision ID bound into MAC</text><text x="800" y="236">Existing checked queue</text><text x="800" y="265" font-size="15">One check and one execution</text><text x="800" y="290" font-size="15">Existing lease and budget</text></g>
<g fill="none" stroke="#6c8eaa" stroke-width="3" marker-end="url(#arrow)"><path d="M320 175H360V230H410"/><path d="M320 315H360V285H410"/><path d="M690 257H780"/><path d="M930 315V375"/></g>
<rect x="410" y="380" width="670" height="88" rx="12" fill="#173b39" stroke="#67b6a4" stroke-width="2"/>
<g fill="#eafff7" font-family="sans-serif"><text x="430" y="414" font-size="19">Final PostgreSQL fence before possible dispatch</text><text x="430" y="444" font-size="15">Revoked review, changed epoch or stale task → refuse new dispatch</text></g>
<g fill="#b6c9dd" font-family="sans-serif" font-size="15"><text x="40" y="505">Already uncertain effects retain their original job identity and held reservation.</text><text x="40" y="533">No automatic replay, permission grant, candidate promotion or new RPC authority.</text></g></svg>
