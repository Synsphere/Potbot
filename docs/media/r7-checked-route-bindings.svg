<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
<title id="title">Compiled route inputs checked against the worker</title><desc id="desc">Architecture illustration. A frozen recipe and private task facts compile into an immutable receipt. The existing worker recompiles the facts and checks observed admission identity. Missing or changed proof blocks the existing queue's execution. Native dispatch still uses Syn.</desc>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#83a8c2"/></marker></defs><rect width="1120" height="540" fill="#101b2c"/>
<g font-family="sans-serif" fill="#edf5ff"><text x="40" y="48" font-size="25" font-weight="bold">A hash must describe the input that actually executes.</text><text x="40" y="82" font-size="16" fill="#b6c9dd">R7.4-D architecture illustration · compiled shadow routes · candidate execution blocked</text></g>
<g fill="#1b334d" stroke="#5a829f" stroke-width="2"><rect x="40" y="135" width="285" height="105" rx="12"/><rect x="40" y="285" width="285" height="105" rx="12"/><rect x="410" y="210" width="290" height="105" rx="12"/><rect x="785" y="210" width="295" height="105" rx="12"/></g>
<g font-family="sans-serif" fill="#edf5ff" font-size="18"><text x="60" y="171">Frozen prompt recipe</text><text x="60" y="202" font-size="15">Before independent review</text><text x="60" y="321">Private task facts</text><text x="60" y="352" font-size="15">Evidence remains task data</text><text x="430" y="246">Compilation receipt</text><text x="430" y="277" font-size="15">Exact request and prompt</text><text x="805" y="246">Existing checked worker</text><text x="805" y="277" font-size="15">Recompile and compare</text></g>
<g fill="none" stroke="#83a8c2" stroke-width="3" marker-end="url(#a)"><path d="M325 187H365V245H410"/><path d="M325 337H365V280H410"/><path d="M700 262H785"/><path d="M930 315V385"/></g>
<rect x="410" y="390" width="670" height="90" rx="12" fill="#173b39" stroke="#67b6a4" stroke-width="2"/>
<g font-family="sans-serif" fill="#eafff7"><text x="430" y="424" font-size="18">Missing proof or changed admission identity → refuse</text><text x="430" y="456" font-size="15">Original queue, budget and Syn worker boundaries remain in force</text></g>
<text x="40" y="518" font-size="15" font-family="sans-serif" fill="#b6c9dd">Admission identity is not independent attestation of model weights or server hardware.</text></svg>
