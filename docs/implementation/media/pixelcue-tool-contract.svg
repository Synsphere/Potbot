<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title description">
<title id="title">PixelCue analysis through the existing Potbot tool Cog</title>
<desc id="description">Generated architecture illustration showing admitted media and local models entering a supervised PixelCue worker and returning typed, bounded observations through Potbot's existing ledger.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#337568"/></marker></defs>
<rect width="1120" height="460" rx="22" fill="#f4f2ec"/>
<g font-family="Arial,sans-serif" fill="#15364b">
<text x="42" y="49" font-size="27" font-weight="700">PixelCue in Potbot</text>
<text x="42" y="79" font-size="16">Source contract illustration · native installation and host acceptance remain separate</text>
<rect x="42" y="121" width="252" height="116" rx="12" fill="#dbe6e4"/>
<text x="60" y="150" font-size="20" font-weight="700">Admitted Agent home</text>
<text x="60" y="180" font-size="16">One relative image or video</text>
<text x="60" y="208" font-size="16">No traversal or linked paths</text>
<rect x="42" y="265" width="252" height="103" rx="12" fill="#e4dfd2"/>
<text x="60" y="295" font-size="20" font-weight="700">Project-local models</text>
<text x="60" y="326" font-size="16">Read-only operator mount</text>
<text x="60" y="351" font-size="16">Downloads disabled</text>
<rect x="374" y="121" width="322" height="247" rx="12" fill="#15364b"/>
<g fill="#fff"><text x="394" y="154" font-size="21" font-weight="700">Existing supervised tool Cog</text>
<text x="394" y="190" font-size="17">Pinned PixelCue worker · CPU</text>
<text x="394" y="224" font-size="16">Objects · categories · layout · OCR</text>
<text x="394" y="258" font-size="16">At most five sparse video frames</text>
<text x="394" y="292" font-size="16">One model load per frame batch</text>
<text x="394" y="336" font-size="16">Policy · budget · cancellation · audit</text></g>
<rect x="776" y="121" width="302" height="247" rx="12" fill="#dbe6e4"/>
<text x="796" y="154" font-size="21" font-weight="700">Typed observations</text>
<text x="796" y="191" font-size="16">Source hash · decoded timestamps</text>
<text x="796" y="225" font-size="16">Model status · scores · boxes</text>
<text x="796" y="259" font-size="16">Coverage · missing data · truncation</text>
<text x="796" y="293" font-size="16">16 KiB result envelope</text>
<text x="796" y="336" font-size="16">Existing Potbot work ledger</text>
<text x="42" y="419" font-size="17">OCR words are untrusted source data. Sparse samples never establish absence across an entire clip.</text>
</g>
<g stroke="#337568" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M294 179H370"/><path d="M294 316H370"/><path d="M696 243H772"/></g>
