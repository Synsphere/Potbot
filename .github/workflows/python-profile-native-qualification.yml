name: Python profiling installed-runtime qualification

on:
  push:
    branches: [main]
    paths:
      - 'src/potbot/tools/python_profile*'
      - 'src/potbot/controller/execution_cogs.py'
      - 'src/potbot/controller/execution_journal.py'
      - 'src/potbot/tools/shared_workspace_isolation.py'
      - 'scripts/qualify_python_profile_cog.py'
      - 'scripts/fixtures/python_profile_workload.py'
      - 'tests/unit/test_python_profile_qualification.py'
      - '.github/workflows/python-profile-native-qualification.yml'
  pull_request:
    paths:
      - 'src/potbot/**'
      - 'scripts/qualify_python_profile_cog.py'
      - 'scripts/fixtures/python_profile_workload.py'
      - 'tests/unit/test_python_profile_qualification.py'
      - '.github/workflows/python-profile-native-qualification.yml'
  workflow_dispatch:
    inputs:
      run_live:
        description: 'Qualify the installed profiler on an already provisioned native Syn worker'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  qualification-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra postgres --extra semantics --extra security --dev
      - name: Validate installed-host evidence and reject incomplete qualification
        run: >-
          .venv/bin/python -m pytest -q tests/unit/test_python_profile_qualification.py
          --junitxml=artifacts/python-profile-contracts.xml
      - name: Check qualifier source
        run: >-
          .venv/bin/python -m ruff check scripts/qualify_python_profile_cog.py
          scripts/fixtures/python_profile_workload.py tests/unit/test_python_profile_qualification.py

  installed-native-profile:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_live &&
      github.ref == 'refs/heads/main' && github.repository == 'kieransimkin/potbot'
    needs: qualification-contracts
    runs-on: [self-hosted, linux, potbot-worker-qualified]
    environment: worker-qualification
    timeout-minutes: 15
    concurrency:
      group: potbot-worker-qualification
      cancel-in-progress: false
    env:
      POTBOT_OPERATOR_REQUIRED: '1'
      POTBOT_PYTHON_PROFILE_POLICY: ${{ vars.POTBOT_PYTHON_PROFILE_POLICY }}
      POTBOT_PYTHON_PROFILE_DSN: ${{ secrets.POTBOT_PYTHON_PROFILE_DSN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.23'
      - run: uv sync --locked --extra postgres --extra semantics --extra security --dev
      - name: Require the existing private host policy and installed accounting environment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POTBOT_PYTHON_PROFILE_POLICY"
          test -f "$POTBOT_PYTHON_PROFILE_POLICY"
          test -n "$POTBOT_PYTHON_PROFILE_DSN"
          test -n "${POTBOT_OPERATOR_SCOPED_LAUNCHER:-}"
          umask 077
          mkdir -p artifacts/python-profile-native
          test "$(stat -c %a artifacts/python-profile-native)" = 700
      - name: Execute the admitted profiling Cog and verify receipt and task accounting
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.qualify_python_profile_cog \
            --policy "$POTBOT_PYTHON_PROFILE_POLICY" \
            --report "$GITHUB_WORKSPACE/artifacts/python-profile-native/profile-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json" \
            --run-live
      - name: Retain the bounded qualification result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-profile-native-qualification
          path: artifacts/python-profile-native/profile-*.json
          if-no-files-found: warn
          retention-days: 14
