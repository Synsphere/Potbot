name: U04-M live MCP discovery and reconciliation
on:
  push:
    paths:
      - 'src/potbot/tools/mcp*.py'
      - 'src/potbot/tools/interactive_supervisor.py'
      - 'src/potbot/tools/gateway.py'
      - 'src/potbot/controller/mcp_discovery.py'
      - 'src/potbot/api/*mcp*discovery*.py'
      - 'src/potbot/api/server_cli.py'
      - 'src/potbot/cli.py'
      - 'src/potbot/persistence/mcp_discovery_schema.py'
      - 'src/potbot/persistence/schema.py'
      - 'frontend/src/app/api/ui/mcp-discovery/**'
      - 'frontend/src/app/discover/mcp/**'
      - 'frontend/src/lib/mcp-discovery*.ts'
      - 'frontend/src/lib/server/mcp-discovery.ts'
      - 'frontend/tests/mcp-discovery*'
      - 'frontend/tests/fixtures/mcp-discovery-http.json'
      - 'tests/unit/test_mcp*.py'
      - 'tests/unit/test_ui_mcp_discovery.py'
      - 'tests/unit/test_interactive_supervisor.py'
      - 'tests/integration/test_mcp_discovery*.py'
      - 'tests/integration/test_execution_gateway.py'
      - 'tests/integration/test_discovery.py'
      - 'tests/fixtures/mcp_live*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'compose.yaml'
      - '.github/workflows/mcp-discovery-u04-m.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mcp-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Disposable fixture credentials, never a production database.
      POTBOT_TEST_DSN: postgresql://potbot_test:potbot_test_only@127.0.0.1:55432/potbot_test
      POTBOT_MCP_DISCOVERY_CONTRACT_OUTPUT: artifacts/mcp-discovery-http.json
      POTBOT_DISCOVERY_CONTRACT_OUTPUT: artifacts/inherited/discovery-http.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install the locked application and test environment
        run: uv sync --locked --extra postgres --extra credentials --extra web --dev
      - name: Start real PostgreSQL and pgvector
        run: docker compose up --detach --wait --wait-timeout 90
      - name: Verify complete catalogues, native lifetimes and durable current references
        run: >-
          uv run --locked python -m pytest -q
          tests/unit/test_mcp_live_discovery.py
          tests/unit/test_mcp_discovery_host.py
          tests/unit/test_mcp_discovery_gateway.py
          tests/unit/test_mcp_discovery_cli.py
          tests/unit/test_mcp_discovery_cli_execution.py
          tests/unit/test_ui_mcp_discovery.py
          tests/unit/test_mcp_protocol.py
          tests/unit/test_mcp_stdio.py
          tests/unit/test_mcp_http.py
          tests/unit/test_mcp_http_broker.py
          tests/unit/test_mcp_http_worker.py
          tests/unit/test_mcp_sandbox.py
          tests/unit/test_mcp_oauth.py
          tests/unit/test_interactive_supervisor.py
          tests/integration/test_mcp_discovery.py
          tests/integration/test_mcp_discovery_gateway.py
          tests/integration/test_execution_gateway.py::test_mcp_gateway_pins_intent_and_settles_or_fences_without_replay
          tests/integration/test_discovery.py::test_actual_http_discovery_lifecycle_exports_only_public_contracts
          --junitxml=artifacts/mcp-discovery-u04-m.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual HTTP projections and operator recovery
        run: >-
          node --experimental-strip-types --test
          frontend/tests/mcp-discovery-contract.test.mjs
          frontend/tests/mcp-discovery.test.mjs
          frontend/tests/mcp-discovery-routes.test.mjs
          frontend/tests/mcp-discovery-recovery.test.mjs
      - name: Retain MCP discovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-discovery-u04-m
          path: |
            artifacts/mcp-discovery-u04-m.xml
            artifacts/mcp-discovery-http.json
            artifacts/inherited/discovery-http.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable database
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 10
