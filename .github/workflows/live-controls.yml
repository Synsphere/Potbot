name: Live configuration and native worker controls
on:
  push:
    paths:
      - 'src/potbot/**'
      - 'tests/unit/test_live_controls*.py'
      - 'tests/integration/test_live_controls.py'
      - 'tests/integration/test_desktop_live_controls.py'
      - '.github/workflows/live-controls.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt-widgets:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      UV_PYTHON: '3.12'
      UV_CACHE_DIR: ${{ github.workspace }}/.potbot/uv-cache
      QT_QPA_PLATFORM: offscreen
      POTBOT_REQUIRE_DESKTOP_TESTS: '1'
      POTBOT_QT_CAPTURE_DIR: ${{ github.workspace }}/artifacts/live-controls/qt-${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.23'
      - name: Install Linux offscreen Qt prerequisites
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci_prepare_ubuntu_mirror.sh
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 fonts-dejavu-core
      - name: Install locked native dependencies
        run: uv sync --locked --extra desktop --extra credentials --extra postgres --extra semantics --dev
      - name: Verify real Qt reviews, conflicts, recovery and owned process lifecycle
        run: >-
          uv run --locked --extra desktop --extra credentials python -m pytest -q
          tests/unit/test_live_controls.py tests/unit/test_live_controls_qt.py
          tests/unit/test_desktop.py tests/unit/test_desktop_settings_client.py
          tests/unit/test_desktop_settings_qt.py
          --junitxml=artifacts/live-controls/qt.xml
      - name: Require executed tests without skips
        shell: bash
        run: |
          uv run --locked --extra desktop --extra credentials python - <<'PY'
          from xml.etree import ElementTree
          cases = list(ElementTree.parse('artifacts/live-controls/qt.xml').iter('testcase'))
          if len(cases) < 55 or any(case.find(tag) is not None for case in cases for tag in ('skipped','failure','error')):
              raise SystemExit('Actual Qt/live-control acceptance must execute without skips')
          print(f'{len(cases)} actual native and contract cases passed')
          PY
      - name: Verify formatting and installed and optional Qt types
        shell: bash
        run: |
          files='src/potbot/api/live_controls.py src/potbot/api/ui_settings.py src/potbot/api/ui_resources.py src/potbot/api/remote_workspaces_cli.py src/potbot/controller/live_configuration.py src/potbot/controller/node_controls.py src/potbot/controller/tasks.py src/potbot/controller/jobs.py src/potbot/domain/live_controls.py src/potbot/domain/ui_preferences.py src/potbot/persistence/schema.py src/potbot/persistence/live_controls_schema.py src/potbot/tools/node_supervisor.py src/potbot/tools/inventory.py src/potbot/desktop_live_settings.py src/potbot/desktop_settings.py src/potbot/desktop_settings_client.py src/potbot/desktop_settings_state.py'
          tests='tests/unit/test_live_controls.py tests/unit/test_live_controls_qt.py tests/integration/test_live_controls.py tests/integration/test_desktop_live_controls.py'
          uv run --locked --extra desktop --extra credentials ruff check $files $tests
          uv run --locked --extra desktop --extra credentials ruff format --check $files $tests
          uv run --locked --extra desktop --extra credentials mypy $files
          uv run --locked --extra desktop --extra credentials mypy --config-file tests/fixtures/mypy-native-headless.toml --cache-dir .potbot/live-controls/mypy-headless $files
      - name: Retain actual native captures and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-controls-${{ matrix.os }}
          path: artifacts/live-controls/
          if-no-files-found: warn
          retention-days: 14
      - name: Record completion assessment
        if: always()
        shell: bash
        run: |
          printf '%s\n' 'Blogworthiness: FAIL. Routine native regression replay; evidence is this run, JUnit and captures of Qt with synthetic records. Production host qualification is separate.' >> "$GITHUB_STEP_SUMMARY"
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UV_PYTHON: '3.12'
      UV_CACHE_DIR: ${{ github.workspace }}/.potbot/uv-cache
      QT_QPA_PLATFORM: offscreen
      POTBOT_REQUIRE_DESKTOP_TESTS: '1'
      POTBOT_QT_CAPTURE_DIR: ${{ github.workspace }}/artifacts/live-controls/sql-qt
      POTBOT_TEST_DSN: postgresql://potbot_test:potbot_test_only@127.0.0.1:55432/potbot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.12.23'
      - name: Install Linux Qt prerequisites
        run: |
          bash scripts/ci_prepare_ubuntu_mirror.sh
          sudo apt-get update
          sudo apt-get install --yes libegl1 libopengl0 fonts-dejavu-core
      - name: Install locked dependencies
        run: uv sync --locked --extra desktop --extra credentials --extra postgres --extra semantics --dev
      - name: Start owned disposable PostgreSQL
        run: docker compose -p live-controls-tests up --detach --wait --wait-timeout 90
      - name: Verify real RLS, task snapshots, drain fencing, worker restarts and native Qt
        run: >-
          uv run --locked --extra desktop --extra credentials --extra postgres --extra semantics python -m pytest -q
          tests/integration/test_live_controls.py tests/integration/test_desktop_live_controls.py
          tests/integration/test_tasks.py tests/integration/test_jobs.py
          tests/integration/test_ui_settings.py tests/integration/test_remote_workspaces.py
          tests/integration/test_database.py tests/integration/test_context_acl.py
          --junitxml=artifacts/live-controls/postgres.xml
      - name: Require executed PostgreSQL and Qt tests without skips
        run: |
          uv run --locked --extra desktop --extra credentials python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          cases = list(ElementTree.parse('artifacts/live-controls/postgres.xml').iter('testcase'))
          live = [c for c in cases if c.get('classname','').endswith(('test_live_controls','test_desktop_live_controls'))]
          if len(live) < 8 or any(c.find(tag) is not None for c in cases for tag in ('skipped','failure','error')):
              raise SystemExit('Real PostgreSQL/native worker acceptance must execute without skips')
          if not Path('artifacts/live-controls/postgres-native-http.json').is_file():
              raise SystemExit('Missing Qt/HTTP/SQL/process receipt')
          print(f'{len(live)} live-control and {len(cases)} total PostgreSQL cases passed')
          PY
      - name: Retain native and SQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: live-controls-postgres
          path: artifacts/live-controls/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove only this job's disposable fixture
        if: always()
        run: docker compose -p live-controls-tests down --volumes --remove-orphans --timeout 10
      - name: Record completion assessment
        if: always()
        run: |
          printf '%s\n' 'Blogworthiness: FAIL. Routine isolated SQL replay; evidence is this run and retained native, HTTP, JUnit and process receipts. No production host, transport or inference qualification.' >> "$GITHUB_STEP_SUMMARY"
