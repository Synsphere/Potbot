name: Agentic model benchmark preflight (no paid calls)

on:
  push:
    paths:
      - 'src/potbot/evaluation/agentic_*'
      - 'src/potbot/controller/atomic_tasks.py'
      - 'scripts/benchmark_agentic_models.py'
      - 'examples/agentic-benchmark/**'
      - 'tests/unit/test_agentic_*'
      - '.github/workflows/agentic-model-benchmark.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly offline contract regression only; provider credentials are NOT used.
    - cron: '37 3 * * 1'

permissions:
  contents: read

jobs:
  model-benchmark-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.23'
      - name: Install exact locked dev environment
        run: uv sync --locked --extra providers --dev
      - name: Verify offline model-role and judge calibration contracts
        run: |
          uv run --locked python -m pytest -q \
            tests/unit/test_agentic_shadow.py \
            tests/unit/test_agentic_ollama_transport.py \
            tests/unit/test_agentic_openai_profile.py \
            tests/unit/test_agentic_experiments.py \
            tests/unit/test_agentic_experiment_json.py \
            tests/unit/test_agentic_candidate_dataset.py \
            tests/unit/test_agentic_candidate_edges.py \
            tests/unit/test_agentic_deployments.py \
            tests/unit/test_agentic_deployment_reports.py \
            tests/unit/test_model_preflight.py \
            tests/unit/test_agentic_reviewers.py \
            tests/unit/test_agentic_reference.py \
            tests/unit/test_agentic_atomic_bench.py \
            tests/unit/test_agentic_model_bench.py \
            tests/unit/test_agentic_benchmark_transport.py \
            tests/unit/test_agentic_benchmark_cli.py
      - name: Inspect model benchmark plan without network calls
        run: |
          mkdir -p artifacts/agentic-benchmark
          uv run --locked python scripts/benchmark_agentic_models.py preflight \
            --models examples/agentic-benchmark/local-models.json \
            --suite examples/agentic-benchmark/role-suite.json \
            > artifacts/agentic-benchmark/preflight.json
      - name: Execute source-pinned pure reference baseline
        run: |
          uv run --locked python scripts/benchmark_agentic_models.py pin-reference \
            --output artifacts/agentic-benchmark/reference-models.json
          uv run --locked python scripts/benchmark_agentic_models.py prepare-experiment \
            --models artifacts/agentic-benchmark/reference-models.json \
            --suite examples/agentic-benchmark/atomic-reference-suite.json \
            --dataset-card examples/agentic-benchmark/atomic-reference-card.json \
            --output artifacts/agentic-benchmark/experiment-plan.json
          uv run --locked python scripts/benchmark_agentic_models.py run \
            --models artifacts/agentic-benchmark/reference-models.json \
            --suite examples/agentic-benchmark/atomic-reference-suite.json \
            --dataset-card examples/agentic-benchmark/atomic-reference-card.json \
            --experiment-plan artifacts/agentic-benchmark/experiment-plan.json \
            --output-dir artifacts/agentic-benchmark/reference-runs --store-text \
            > artifacts/agentic-benchmark/reference-run.json
          uv run --locked python scripts/benchmark_agentic_models.py audit-atomic-suite \
            --suite examples/agentic-benchmark/atomic-reference-suite.json \
            --dataset-card examples/agentic-benchmark/atomic-reference-card.json \
            --output artifacts/agentic-benchmark/dataset-audit.json
      - name: Audit the complete predeclared pure-reference cohort
        run: |
          uv run --locked python - <<'PY'
          import json
          import runpy
          from pathlib import Path
          root = Path("artifacts/agentic-benchmark")
          run = json.loads((root / "reference-run.json").read_text())
          cli = runpy.run_path("scripts/benchmark_agentic_models.py")
          raise SystemExit(cli["main"]([
              "audit-experiment", "--models", str(root / "reference-models.json"),
              "--suite", "examples/agentic-benchmark/atomic-reference-suite.json",
              "--dataset-card", "examples/agentic-benchmark/atomic-reference-card.json",
              "--experiment-plan", str(root / "experiment-plan.json"),
              "--results", str(Path(run["report_dir"]) / "report.json"),
              "--output", str(root / "experiment-audit.json"),
          ]))
          PY
      - name: Upload unqualified plan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentic-benchmark-offline-plan
          path: artifacts/agentic-benchmark
          retention-days: 14
      - name: Record run blogworthiness
        if: always()
        shell: bash
        run: |
          echo "Blogworthiness: FAIL - routine offline benchmark-contract verification. Evidence: the tests and unqualified preflight artifact at $GITHUB_SHA; no live model comparison or new deployment is established by this run." >> "$GITHUB_STEP_SUMMARY"
